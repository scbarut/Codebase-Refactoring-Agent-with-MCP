[project]
name = "migration-agent"
version = "0.1.0"
description = "Autonomous Codebase Refactoring & Migration Agent with MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Agentic Team" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.18",
    "litellm>=1.35.0",
    "libcst>=1.1.0",
    "structlog>=24.1.0",
    "docker>=7.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "ruff>=0.3.0",
]

[project.scripts]
migration-agent = "src.cli:main"
mcp-server-git = "src.mcp_servers.git_server:main"
mcp-server-ast = "src.mcp_servers.ast_server:main"
mcp-server-docs = "src.mcp_servers.docs_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "docker: marks tests requiring a running Docker daemon",
]

